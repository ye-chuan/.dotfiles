# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

# Defaults are commented

[mgr]
ratio          = [ 1, 4, 1 ]
sort_by        = "natural"
#sort_sensitive = false
#sort_reverse   = false
#sort_dir_first = true
#sort_translit  = false
#linemode       = "none"
#show_hidden    = false
#show_symlink   = true
#scrolloff      = 5
#mouse_events   = [ "click", "scroll" ]
#title_format   = "Yazi: {cwd}"

[preview]
#wrap            = "no"
#tab_size        = 2
max_width       = 1200
max_height      = 1200
#cache_dir       = ""
#image_delay     = 30
#image_filter    = "triangle"
#image_quality   = 75
#ueberzug_scale  = 1
#ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
	{ run = "${EDITOR:-vi} %s", desc = "Edit Here",    for = "unix", block = true },
	{ run = "code %s",          desc = "code",         for = "windows", orphan = true },
	{ run = "code -w %s",       desc = "code (block)", for = "windows", block = true },
]
#play = [
#	{ run = "xdg-open %s1",                desc = "Play", for = "linux" },
#	{ run = "open %s",                     desc = "Play", for = "macos" },
#	{ run = 'start "" %s1', orphan = true, desc = "Play", for = "windows" },
#	{ run = "termux-open %s1",             desc = "Play", for = "android" },
#	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
#	{ run = "mediainfo %s1 & pause", block = true, desc = "Show media info", for = "windows" },
#]
#open = [
#	{ run = "xdg-open %s1",    desc = "Open", for = "linux" },
#	{ run = "open %s",         desc = "Open", for = "macos" },
#	{ run = 'start "" %s1',    desc = "Open", for = "windows", orphan = true },
#	{ run = "termux-open %s1", desc = "Open", for = "android" },
#]
#reveal = [
#	{ run = "xdg-open %d1",         desc = "Reveal", for = "linux" },
#	{ run = "open -R %s1",          desc = "Reveal", for = "macos" },
#	{ run = "explorer /select,%s1", desc = "Reveal", for = "windows", orphan = true },
#	{ run = "termux-open %d1",      desc = "Reveal", for = "android" },
#	{ run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF", for = "unix", block = true },
#]
#extract = [
#	{ run = "ya pub extract --list %s", desc = "Extract here" },
#]
#download = [
#	{ run = "ya emit download --open %S", desc = "Download and open" },
#	{ run = "ya emit download %S",        desc = "Download" },
#]
edit_text_new = [
	{ run = "$TERMINAL -e ${EDITOR:-vi} %s", desc = "Edit", for = "unix", block = false , orphan = true},
]
edit_image = [
	{ run = "gimp %S", desc = "Edit with GIMP" },
]
edit_office = [
	# The extra /. is a simple attempt prevent ambiguity (as options to libreoffice)
	# if the filename happens to start with `-` since we are matching by mimetype
	{ run = "libreoffice /.%S", desc = "LibreOffice", for = "linux" },
]

[open]
prepend_rules = [
 	# Text
 	{ mime = "text/*", use = [ "edit_text_new", "edit", "reveal" ] },
	# Image
	{ mime = "image/*", use = [ "open", "edit_image", "reveal" ] },
	# Word Document
	{ mime = "application/{clarisworks,docbook+xml,macwriteii,msword,prs.plucker,rtf,*apple.pages,*lotus-wordpro,*ms-word,*ms-word.document.macroEnabled.12,*ms-word.template.macroEnabled.12,*ms-works,*oasis.opendocument.text,*oasis.opendocument.text-flat-xml,*oasis.opendocument.text-master,*oasis.opendocument.text-master-template,*oasis.opendocument.text-template,*oasis.opendocument.text-web,*openxmlformats-officedocument.wordprocessingml.document,*openxmlformats-officedocument.wordprocessingml.template,*palm,*stardivision.writer-global,*sun.xml.writer,*sun.xml.writer.global,*sun.xml.writer.template,*wordperfect,wordperfect,x-abiword,x-aportisdoc,x-doc,x-extension-txt,x-fictionbook+xml,x-hwp,x-iwork-pages-sffpages,x-mswrite,x-pocket-word,x-sony-bbeb,x-starwriter,x-starwriter-global,x-t602}", use = [ "open", "edit_office", "reveal" ] },
	# Spreadsheet Document
	{ mime = "application/{clarisworks,csv,excel,msexcel,tab-separated-values,*apache.parquet,*apple.numbers,*lotus-1-2-3,*ms-excel,*ms-excel.sheet.binary.macroEnabled.12,*ms-excel.sheet.macroEnabled.12,*ms-excel.template.macroEnabled.12,*ms-works,*oasis.opendocument.chart,*oasis.opendocument.chart-template,*oasis.opendocument.spreadsheet,*oasis.opendocument.spreadsheet-flat-xml,*oasis.opendocument.spreadsheet-template,*openxmlformats-officedocument.spreadsheetml.sheet,*openxmlformats-officedocument.spreadsheetml.template,*stardivision.calc,*stardivision.chart,*sun.xml.calc,*sun.xml.calc.template,x-123,x-dbase,x-dbf,x-dos_ms_excel,x-excel,x-gnumeric,x-iwork-numbers-sffnumbers,x-ms-excel,x-msexcel,x-quattropro,x-starcalc,x-starchart}", use = [ "open", "edit_office", "reveal" ] },
	{ mime = "text/{comma-separated-values,csv,spreadsheet,tab-separated-values,x-comma-separated-values,x-csv}", use = [ "open", "edit_office", "reveal" ] },
	# Slideshow Document
	{ mime = "application/{mspowerpoint,*apple.keynote,*ms-powerpoint,*ms-powerpoint.presentation.macroEnabled.12,*ms-powerpoint.slideshow.macroEnabled.12,*ms-powerpoint.template.macroEnabled.12,*oasis.opendocument.presentation,*oasis.opendocument.presentation-flat-xml,*oasis.opendocument.presentation-template,*openxmlformats-officedocument.presentationml.presentation,*openxmlformats-officedocument.presentationml.slide,*openxmlformats-officedocument.presentationml.slideshow,*openxmlformats-officedocument.presentationml.template,*stardivision.impress,*sun.xml.impress,*sun.xml.impress.template,x-iwork-keynote-sffkey,x-starimpress}", use = [ "open", "edit_office", "reveal" ] },
]

